@if (password()) {
  <div class="strength" aria-live="polite">
    <div class="strength__header">
      <span>Password strength</span>
      <span class="strength__label strength__label--{{ strength().label.toLowerCase() }}">
        {{ strength().label }}
      </span>
    </div>
    <div class="strength__bar" role="progressbar" [attr.aria-valuenow]="strength().score" aria-valuemin="0" aria-valuemax="5">
      <span class="strength__fill strength__fill--{{ strength().label.toLowerCase() }}" [style.width]="barWidth()"></span>
    </div>
    <ul class="strength__checks">
      <li [class.is-met]="strength().checks.length">More than 8 characters</li>
      <li [class.is-met]="strength().checks.uppercase">Uppercase letter</li>
      <li [class.is-met]="strength().checks.lowercase">Lowercase letter</li>
      <li [class.is-met]="strength().checks.number">Number</li>
      <li [class.is-met]="strength().checks.special">Special character</li>
    </ul>
  </div>
}
