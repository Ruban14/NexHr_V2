<mat-form-field appearance="outline" class="nexhr-field" subscriptSizing="dynamic">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    [attr.id]="inputId() || null"
    [type]="visible() ? 'text' : 'password'"
    [formControl]="control()"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    [attr.aria-invalid]="!!error()"
    [attr.aria-describedby]="error() ? inputId() + '-error' : null"
  />
  <button
    mat-icon-button
    matSuffix
    type="button"
    class="toggle-btn"
    [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
    [attr.aria-pressed]="visible()"
    (click)="toggleVisibility()"
  >
    <mat-icon>{{ visible() ? 'visibility_off' : 'visibility' }}</mat-icon>
  </button>
  @if (error()) {
    <mat-error [id]="inputId() + '-error'">{{ error() }}</mat-error>
  }
</mat-form-field>
