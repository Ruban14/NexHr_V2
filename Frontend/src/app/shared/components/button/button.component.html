<button
  [attr.type]="type()"
  class="nexhr-btn"
  [class]="['nexhr-btn--' + variant(), 'nexhr-btn--' + size(), fullWidth() ? 'nexhr-btn--full' : '']"
  [disabled]="disabled() || loading()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-busy]="loading()"
  (click)="onClick($event)"
>
  @if (loading()) {
    <mat-spinner diameter="22" class="nexhr-btn__spinner" aria-hidden="true" />
  }
  <span class="nexhr-btn__content" [class.nexhr-btn__content--hidden]="loading()">
    @if (leadingIcon()) {
      <mat-icon class="nexhr-btn__icon" aria-hidden="true">{{ leadingIcon() }}</mat-icon>
    }
    <span class="nexhr-btn__label"><ng-content /></span>
    @if (trailingIcon()) {
      <mat-icon class="nexhr-btn__icon nexhr-btn__icon--trailing" aria-hidden="true">{{ trailingIcon() }}</mat-icon>
    }
  </span>
</button>
