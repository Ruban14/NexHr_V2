<app-card>
  <div card-header class="auth-page__header">
    <h2>Reset your password</h2>
    <p>Enter the email associated with your account and we will send reset instructions.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (serverError()) {
      <div class="auth-alert auth-alert--error" role="alert">{{ serverError() }}</div>
    }
    @if (successMessage()) {
      <div class="auth-alert auth-alert--success" role="status">{{ successMessage() }}</div>
    }

    <app-form-field
      label="Email"
      inputId="forgot-email"
      type="email"
      autocomplete="email"
      placeholder="you@company.com"
      [control]="form.controls.email"
      [error]="emailError()"
    />

    <app-button type="submit" [fullWidth]="true" [loading]="authStore.actionLoading()">
      Send reset link
    </app-button>
  </form>

  <div card-footer class="auth-page__footer">
    <a routerLink="/auth/login" class="auth-link">Back to sign in</a>
  </div>
</app-card>
