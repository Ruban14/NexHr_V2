<app-card>
  <div card-header class="auth-page__header">
    <h2>Choose a new password</h2>
    <p>Use a strong password with more than 8 characters.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (serverError()) {
      <div class="auth-alert auth-alert--error" role="alert">{{ serverError() }}</div>
    }
    @if (formError()) {
      <div class="auth-alert auth-alert--error" role="alert">{{ formError() }}</div>
    }

    <app-password-input
      label="New password"
      inputId="reset-password"
      autocomplete="new-password"
      [control]="form.controls.password"
      [error]="fieldError(form.controls.password, 'Password')"
    />

    @if (form.controls.password.value) {
      <app-password-strength [password]="form.controls.password.value" />
    }

    <app-password-input
      label="Confirm new password"
      inputId="reset-password-confirm"
      autocomplete="new-password"
      [control]="form.controls.password_confirm"
      [error]="fieldError(form.controls.password_confirm, 'Password confirmation')"
    />

    <app-button type="submit" [fullWidth]="true" [loading]="actionLoading()" [disabled]="!token()">
      Update password
    </app-button>
  </form>

  <div card-footer class="auth-page__footer">
    <a routerLink="/auth/login" class="auth-link">Back to sign in</a>
  </div>
</app-card>
