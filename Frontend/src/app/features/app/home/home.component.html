<div class="home">
  <header class="home__header">
    <app-brand-mark size="sm" />
    <app-button variant="secondary" (pressed)="logout()" [loading]="authStore.actionLoading()">
      Sign out
    </app-button>
  </header>

  <main class="home__main">
    <h1>Welcome, {{ authStore.displayName() }}</h1>
    <p>You are signed in to NexHr.</p>
  </main>
</div>
