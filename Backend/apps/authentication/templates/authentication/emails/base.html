<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>{% block title %}NexHr{% endblock %}</title>
    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
    <![endif]-->
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      width: 100% !important;
      background-color: #f4f6fb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <span
      style="
        display: none !important;
        visibility: hidden;
        opacity: 0;
        color: transparent;
        height: 0;
        width: 0;
        max-height: 0;
        max-width: 0;
        overflow: hidden;
      "
    >
      {% block preheader %}{% endblock %}
    </span>

    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="background-color: #f4f6fb; padding: 40px 16px;"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="100%"
            style="max-width: 560px;"
          >
            <!-- Header -->
            <tr>
              <td align="center" style="padding-bottom: 24px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td
                      align="center"
                      valign="middle"
                      width="44"
                      height="44"
                      style="
                        width: 44px;
                        height: 44px;
                        border-radius: 12px;
                        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
                        color: #ffffff;
                        font-size: 20px;
                        font-weight: 700;
                        line-height: 44px;
                        text-align: center;
                      "
                    >
                      N
                    </td>
                    <td style="padding-left: 12px;">
                      <div style="font-size: 20px; font-weight: 700; color: #0f172a; letter-spacing: -0.02em;">
                        NexHr
                      </div>
                      <div style="font-size: 12px; color: #64748b; letter-spacing: 0.04em; text-transform: uppercase;">
                        Enterprise HR Platform
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Card -->
            <tr>
              <td
                style="
                  background-color: #ffffff;
                  border: 1px solid #e2e8f0;
                  border-radius: 16px;
                  box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
                  overflow: hidden;
                "
              >
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td style="padding: 36px 32px 28px;">
                      {% block content %}{% endblock %}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td align="center" style="padding: 24px 8px 0;">
                <p style="margin: 0 0 8px; font-size: 13px; line-height: 1.6; color: #64748b;">
                  {% block footer_note %}
                    This is an automated message from NexHr. Please do not reply to this email.
                  {% endblock %}
                </p>
                <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #94a3b8;">
                  &copy; {% now "Y" %} NexHr. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
